<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Whiteboard</title>
<!--
  Whiteboard — local explainer canvas.

  Implements the "System Explainer" Claude Design (project 913712b0, file
  `System Explainer.dc.html`) as a dependency-free page: no React, no tldraw, no
  elkjs, no CDN. Everything is inline, so a board renders with the network off.

  The design's DCLogic component is reproduced imperatively: DOM is built once at
  boot, then only positions / edge paths / opacity / marks are patched in place.
  That keeps textarea focus and contenteditable state alive across updates.

  Design-system note: the .dc.html links the Bedrock UI token sheets, but the
  design itself sets every colour and font inline and uses no `bedrock-*` class,
  so the tokens contribute nothing at render time. The palette below is the
  design's own dark scale, lifted to CSS custom properties.
-->
<style>
:root{
  --bg:#0e1116; --panel:#151a22; --card:#151a22;
  --line:#262e3a; --line-2:#333d4c; --card-line:#252d39;
  --well:#11161e; --well-line:#222a35;
  --sunken:#0b0e13; --sunken-line:#1d242e;
  --ink:#e6ebf2; --ink-2:#c8d3e0; --ink-3:#9aa7b8; --ink-4:#8b97a8; --ink-5:#8592a3;
  --chip-line:#2b3441; --rule:#232b36;
  --ok:#47c98a; --info:#5aa2ff; --warn:#ffb648; --pitfall:#c9973f;
  --accent:#5aa2ff;
  --note:#ffd479; --note-ink:#2a2208;
  --edge:#41576e; --edge-back:#4d5a6c;
  --r-card:14px; --r-well:10px; --r-ctl:8px; --r-pill:999px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:ui-sans-serif,-apple-system,'SF Pro Text','Inter',system-ui,sans-serif;
  font-size:13px;-webkit-font-smoothing:antialiased;color-scheme:dark}
button{font:inherit;cursor:pointer}
textarea{font:inherit}
code,.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}

#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}

/* ---- header ------------------------------------------------------------- */
header{display:flex;align-items:center;gap:14px;padding:0 16px;height:54px;flex:none;
  background:var(--panel);border-bottom:1px solid var(--line);z-index:20}
.hd-txt{min-width:120px;flex:1;overflow:hidden}
.hd-title{font-size:14px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-sub{font-size:11px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-right{flex:none;display:flex;align-items:center;gap:10px}
.sep{width:1px;height:24px;background:var(--line)}
.group{display:flex;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-pill)}
.seg{padding:5px 13px;border-radius:var(--r-pill);border:none;font-size:11.5px;font-weight:600;
  background:transparent;color:var(--ink-5)}
.seg.on{background:rgba(255,255,255,.08);color:var(--ink)}
.zoom{display:flex;align-items:center;gap:6px;padding:3px 4px;background:var(--bg);
  border:1px solid var(--line-2);border-radius:var(--r-pill)}
.zoom button{border:none;background:none;color:var(--ink-3);border-radius:var(--r-pill);height:24px}
.zoom .step{width:26px;font-size:15px;line-height:1}
.zoom .fit{padding:0 10px;font-size:11px}
#zoomPct{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:34px;text-align:center}
#copyBtn{padding:7px 13px;border-radius:var(--r-pill);border:1px solid var(--accent);
  background:var(--accent);color:#06172c;font-size:11.5px;font-weight:600;white-space:nowrap}
#copyBtn.done{border-color:var(--ok);background:rgba(71,201,138,.14);color:#9be6c1}

/* ---- canvas ------------------------------------------------------------- */
#surface{position:relative;flex:1;overflow:hidden;background:var(--bg);touch-action:none;
  background-image:radial-gradient(#1c2431 1px,transparent 1px)}
#surface.t-move{cursor:grab}
#surface.t-move.panning{cursor:grabbing}
#surface.t-pen,#surface.t-marker,#surface.t-note,#surface.t-box{cursor:crosshair}
#surface.t-eraser{cursor:not-allowed}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world > svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}

/* Stage names ride inside the card (see cardHTML) — nothing but boxes and the
   edges between them is ever painted onto the canvas itself. */
.eyebrow{font-size:10px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-5);margin-bottom:6px}

/* ---- card ------------------------------------------------------------ */
.card{position:absolute;left:0;top:0;display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--card-line);border-radius:var(--r-card);
  box-shadow:0 6px 20px rgba(0,0,0,.42);overflow:hidden;padding:18px}
.card.key{border-color:#3c4a5e}
.card.dragging{box-shadow:0 18px 44px rgba(0,0,0,.6);z-index:6}
.card.struck{opacity:.42}
.card.struck .card-title{text-decoration:line-through}
#surface.t-move .card{cursor:grab}
#surface.t-move .card.dragging{cursor:grabbing}

.card-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.badge{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:7px;
  background:rgba(255,255,255,.06);color:var(--ink-3);font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums}
.card.key .badge{color:var(--accent)}
.chip{font-size:10.5px;color:var(--ink-5);padding:3px 8px;border:1px solid var(--chip-line);border-radius:var(--r-pill)}
.stat-lbl{font-size:10.5px;color:var(--ink-4);display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:#4a5464}
.toggle{flex:none;margin-left:auto;padding:4px 10px;border-radius:var(--r-pill);
  border:1px solid var(--chip-line);background:transparent;color:var(--ink-5);
  font-size:10.5px;font-weight:600;white-space:nowrap}
.toggle.on{border-color:#5c6a7c;background:rgba(255,255,255,.06);color:#dbe3ec}

.card-title{margin:0;font-size:19px;line-height:1.2;font-weight:650;letter-spacing:-.015em;
  color:var(--ink);text-wrap:pretty;outline:none}
.card-title[contenteditable="true"]{box-shadow:0 0 0 2px var(--accent);border-radius:4px}

.prose{display:grid;margin:10px 0 12px}
.prose p{grid-area:1/1;margin:0;font-size:13.5px;line-height:1.55;color:var(--ink-2);text-wrap:pretty;
  transition:opacity .3s ease,transform .3s ease}
.prose .sim,.pit .sim{opacity:0;transform:translateY(4px);pointer-events:none}
.simple .prose .std,.simple .pit .std{opacity:0;transform:translateY(4px);pointer-events:none}
.simple .prose .sim,.simple .pit .sim{opacity:1;transform:none;pointer-events:auto}

.well{padding:12px;background:var(--well);border:1px solid var(--well-line);border-radius:var(--r-well);margin-bottom:12px}
.well:last-of-type{margin-bottom:0}
.well-lbl{font-size:10px;color:var(--ink-4);margin-bottom:6px}
.well-q{font-size:12.5px;color:var(--ink);font-weight:600;margin-bottom:9px;line-height:1.35}

.stats{display:flex;gap:10px}
.stats > div{flex:1;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-ctl)}
.stat-v{font-size:17px;font-weight:650;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat-k{font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.3}

.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.ba-a,.ba-b{padding:10px 12px;border-radius:var(--r-ctl)}
.ba-a{background:var(--sunken);border:1px solid var(--sunken-line)}
.ba-b{background:var(--bg);border:1px solid #3a4552}
.ba-k{font-size:10px;color:var(--ink-4);margin-bottom:5px}
.ba-a .ba-v{font-size:12px;color:#aab6c4;line-height:1.4}
.ba-b .ba-v{font-size:12px;color:#dbe3ec;line-height:1.4}
.ba-arrow{display:grid;place-items:center;color:#4d5a6c;font-size:15px}

.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;padding:9px 11px;border-radius:var(--r-ctl);border:1px solid var(--chip-line);
  background:var(--bg);color:var(--ink-3);font-size:12.5px;line-height:1.35}
.opt.on{border-color:#5c6a7c;background:rgba(255,255,255,.05);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.qopt{padding:7px 13px;border-radius:var(--r-pill);border:1px solid var(--chip-line);
  background:var(--bg);color:var(--ink-3);font-size:12px}
.qopt.on{border-color:#5c6a7c;background:rgba(255,255,255,.05);color:var(--ink)}
.qopt.on.right{border-color:var(--ok)}
.reply{margin-top:10px;padding:9px 11px;background:rgba(255,255,255,.035);border:1px solid var(--chip-line);
  border-radius:var(--r-ctl);font-size:12px;line-height:1.45;color:#c0cbd8;display:none}
.reply.show{display:block}
.reply.right{background:rgba(71,201,138,.09);border-color:rgba(71,201,138,.34);color:var(--ink-2)}

.code{margin-bottom:12px;padding:10px 12px;background:var(--bg);border:1px solid var(--rule);
  border-radius:var(--r-ctl);font-family:ui-monospace,'SF Mono',Menlo,monospace;
  font-size:11.5px;color:var(--ink-3);line-height:1.5;white-space:pre-wrap}

.pit{padding:11px 13px;background:var(--well);border:1px solid var(--chip-line);border-radius:var(--r-ctl);margin-bottom:12px}
.pit-lbl{font-size:10px;color:var(--pitfall);margin-bottom:3px}
.pit-body{display:grid}
.pit-body div{grid-area:1/1;font-size:12px;line-height:1.45;color:#c0cbd8;transition:opacity .3s ease}

.card-ft{display:flex;align-items:center;gap:7px;margin-top:12px;padding-top:10px;
  border-top:1px solid var(--rule);font-size:10.5px;color:var(--ink-4)}
.card-ft .mono{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- sticky notes ------------------------------------------------------ */
.note{position:absolute;width:190px;height:120px;padding:11px;background:var(--note);
  border-radius:4px;box-shadow:0 8px 18px rgba(0,0,0,.5);transform:rotate(-1deg);z-index:8}
.note textarea{width:100%;height:100%;background:none;border:none;outline:none;resize:none;
  color:var(--note-ink);font-size:12.5px;line-height:1.4}

/* ---- user-drawn boxes -------------------------------------------------- */
.ubox{position:absolute;width:250px;background:var(--card);border:1.5px dashed var(--accent);
  border-radius:var(--r-card);box-shadow:0 6px 20px rgba(0,0,0,.42);z-index:7;overflow:hidden}
.ubox-hd{display:flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(255,255,255,.045);
  border-bottom:1px solid var(--card-line);font-size:9.5px;font-weight:650;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent);cursor:grab}
.ubox.dragging .ubox-hd{cursor:grabbing}
.ubox.dragging{box-shadow:0 18px 44px rgba(0,0,0,.6);z-index:9}
.ubox textarea{display:block;width:100%;height:104px;padding:11px;background:none;border:none;
  outline:none;resize:none;color:var(--ink);font-size:13px;line-height:1.5}

/* ---- edge legend ------------------------------------------------------- */
#legend{position:absolute;right:16px;bottom:18px;z-index:14;display:flex;gap:14px;align-items:center;
  padding:7px 12px;background:rgba(21,26,34,.9);border:1px solid var(--line);border-radius:var(--r-pill);
  backdrop-filter:blur(8px);font-size:10.5px;color:var(--ink-4)}
#legend span{display:flex;align-items:center;gap:6px}
#legend .ln{width:22px;height:0;border-top:1.6px solid var(--edge)}
#legend .ln.dash{border-top-style:dashed;border-color:var(--edge-back);opacity:.75}

/* ---- toolbar ----------------------------------------------------------- */
#toolbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;
  gap:8px;padding:6px;background:rgba(21,26,34,.92);border:1px solid var(--line);border-radius:12px;
  backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:15}
.tool{width:32px;height:30px;border-radius:var(--r-ctl);border:none;font-size:14px;
  background:transparent;color:var(--ink-5)}
.tool.on{background:rgba(255,255,255,.1);color:var(--ink)}
.swatch{width:18px;height:18px;border-radius:50%;border:2px solid transparent;
  outline:1px solid rgba(0,0,0,.4);padding:0}
.swatch.on{border-color:var(--ink)}
#clearBtn{height:30px;padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--line-2);
  background:var(--bg);color:var(--ink-3);font-size:11.5px}

/* ---- status / errors --------------------------------------------------- */
#status{position:fixed;left:14px;bottom:14px;z-index:30;font-size:11.5px;line-height:1;
  color:#9be6c1;background:rgba(71,201,138,.12);border:1px solid rgba(71,201,138,.36);
  border-radius:var(--r-pill);padding:7px 13px;display:none}
#status.busy{color:#ffd79a;background:rgba(255,182,72,.12);border-color:rgba(255,182,72,.36)}
#status.fail{color:#ffb4ac;background:rgba(219,0,0,.14);border-color:rgba(219,0,0,.4)}
#err{position:fixed;left:14px;bottom:48px;max-width:64ch;z-index:30;display:none;
  background:rgba(219,0,0,.12);border:1px solid rgba(219,0,0,.4);color:#ffb4ac;
  padding:9px 11px;border-radius:var(--r-ctl);font:12px/1.45 ui-monospace,monospace;white-space:pre-wrap}
#boot{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-4);font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hd-txt">
      <div class="hd-title" id="hdTitle">Whiteboard</div>
      <div class="hd-sub" id="hdSub">mark it up — every change is saved back for the agent</div>
    </div>
    <div class="hd-right">
      <div class="group">
        <button class="seg on" id="segStd">Standard</button>
        <button class="seg" id="segSim">Plain english</button>
      </div>
      <div class="sep"></div>
      <div class="zoom">
        <button class="step" id="zOut" aria-label="Zoom out">&minus;</button>
        <span id="zoomPct">62%</span>
        <button class="step" id="zIn" aria-label="Zoom in">+</button>
        <button class="fit" id="zFit">Fit</button>
      </div>
      <button id="copyBtn">Copy notes for the agent</button>
    </div>
  </header>

  <div id="surface" class="t-move">
    <div id="world">
      <svg id="edgeLayer"></svg>
      <div id="cards"></div>
      <div id="boxLayer"></div>
      <div id="noteLayer"></div>
      <svg id="markLayer"></svg>
    </div>
    <div id="legend">
      <span><i class="ln"></i>flows into</span>
      <span><i class="ln dash"></i>loops back</span>
    </div>
    <div id="toolbar">
      <div style="display:flex;gap:3px" id="tools"></div>
      <div class="sep"></div>
      <div style="display:flex;gap:5px;align-items:center" id="colors"></div>
      <div class="sep"></div>
      <button id="clearBtn">Clear markup</button>
    </div>
    <div id="boot">Loading board…</div>
  </div>
</div>
<div id="status"></div>
<div id="err"></div>

<script>
'use strict';
(function () {

/* ===================== constants ======================================== */
const CW        = 372;   // card width — from the design
const COL_PITCH = 580;   // column stride — CW + 208px of clear air for edge routing
const ROW_GAP   = 76;    // vertical gap between cards in one column
const TOP       = 90;    // first card's top
const LEFT      = 80;
const PORT_Y    = 56;    // centre of a card's port stack, from its top edge
const PORT_GAP  = 20;    // spacing between ports stacked on one side of a card
const CHANNEL_GAP = 18;  // spacing between vertical routing channels in one gutter
const LANE_GAP  = 22;    // spacing between bypass rows under the board
const EST_H     = 320;   // height guess before the first measure

const STATUS_COLOR = { 'done': 'var(--ok)', 'in flight': 'var(--info)', 'open': 'var(--warn)' };
const TOOLS = [
  { key: 'move',   glyph: '✥', name: 'Move',        title: 'Move (V) — drag the canvas or a card, scroll to zoom' },
  { key: 'pen',    glyph: '✎', name: 'Pen',         title: 'Pen (P) — circle it, cross it out' },
  { key: 'marker', glyph: '▰', name: 'Highlighter', title: 'Highlighter (H) — wide translucent stroke' },
  { key: 'note',   glyph: 'T',      name: 'Note',        title: 'Note (N) — click anywhere to leave a note for the agent' },
  { key: 'box',    glyph: '▭', name: 'New box',     title: 'New box (B) — click empty canvas to add a box of your own' },
  { key: 'eraser', glyph: '⌫', name: 'Eraser',      title: 'Eraser (E) — click a mark, note or new box to remove it; click a card to strike it out' },
];
const COLORS = [['#ff7a1a', 'Orange'], ['#c77dff', 'Violet'], ['#5aa2ff', 'Blue'], ['#47c98a', 'Green']];

const $  = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const errs = [];
function note(msg) { errs.push(msg); const el = $('err'); el.textContent = 'Notes:\n' + errs.join('\n'); el.style.display = 'block'; }

let statusTimer;
function setStatus(kind, text) {
  const el = $('status');
  el.className = kind === 'saved' ? '' : kind;
  el.textContent = text; el.style.display = 'block';
  clearTimeout(statusTimer);
  if (kind === 'saved') statusTimer = setTimeout(() => { el.style.display = 'none'; }, 1800);
}

/* ===================== state ============================================ */
const S = {
  z: 0.62, tx: 40, ty: 20,
  tool: 'move', color: '#ff7a1a',
  modeAll: false, modePer: {},          // false = standard, true = plain english
  pos: {},                              // user-dragged card positions
  titles: {},                           // user-relabelled card titles
  struck: {},                           // cards the user struck out with the eraser
  choices: {}, quiz: {},
  notes: [], marks: [],
  boxes: [],                            // boxes the USER drew with the box tool
};

let SPEC = null;                         // normalised board spec
let CARDS = [];                          // SPEC.cards, in order
let byId = {};
let LAY = {};                            // baseline layout {id:{x,y,w,h,col}}
let LANE_BACK = 0, LANE_LONG = 0, WORLD_W = 2000, WORLD_H = 1200;
let cardEl = {};                         // id -> <article>
let slug = 'board';
let drag = null;
let seq = 0;
const uid = (p) => p + (++seq) + '-' + Math.abs(Math.round(performance.now()));

const isSimple = (id) => (id in S.modePer) ? S.modePer[id] : S.modeAll;

/* ===================== spec normalisation ================================ */
/* Accepts the new card format and, for older boards, the node/edge graph the
   tldraw version used — a `nodes` array becomes plain title-only cards. */
function normalize(raw) {
  const spec = Object.assign({ title: '', subtitle: '', accent: '#5aa2ff', defaultMode: 'standard' }, raw || {});
  let cards = Array.isArray(spec.cards) ? spec.cards.slice() : [];

  if (!cards.length && Array.isArray(spec.nodes)) {
    cards = spec.nodes.map((n) => ({
      id: String(n.id), title: String(n.text || n.title || n.id).replace(/\n/g, ' '),
      stage: n.group || '', kind: n.kind || '', status: n.status || '',
      std: n.std || '', simple: n.simple || '',
    }));
  }
  cards = cards.filter((c) => c && c.id != null).map((c, i) => {
    const o = Object.assign({}, c);
    o.id = String(o.id);
    o.n = o.n || (i + 1);
    o.title = String(o.title || o.id);
    o.stage = o.stage == null ? '' : String(o.stage);
    o.std = o.std == null ? '' : String(o.std);
    o.simple = o.simple == null ? o.std : String(o.simple);
    if (o.stats && !Array.isArray(o.stats)) o.stats = null;
    return o;
  });

  const seen = {};
  spec.cards = cards.filter((c) => (seen[c.id] ? (note('duplicate card id "' + c.id + '" ignored'), false) : (seen[c.id] = 1)));

  // `text` on an edge is accepted and ignored — see routeEdges(): all text on
  // this canvas lives inside a box.
  spec.edges = (Array.isArray(spec.edges) ? spec.edges : []).map((e) => ({
    from: String(e.from), to: String(e.to), lane: e.lane || 'auto',
  })).filter((e) => {
    if (!seen[e.from] || !seen[e.to]) { note('edge ' + e.from + '→' + e.to + ': unknown card, skipped'); return false; }
    return true;
  });

  // legacy free-floating notes/text become sticky notes
  const legacy = [].concat(spec.notes || [], (spec.text || []).map((t) => ({ text: t.text })));
  spec.seedNotes = legacy.filter((n) => n && n.text).map((n) => String(n.text));
  return spec;
}

/* ===================== layout ============================================
   Coordinate-free: a card's column comes from the order its `stage` first
   appears; within a column, cards stack in declaration order. Each column's
   stack is centred on a shared axis, which reproduces the design's fan without
   anyone hand-placing anything. Explicit x/y on a card still wins.        */
function layout() {
  const colOf = {}, cols = [];
  CARDS.forEach((c) => {
    const key = c.stage || '␀col' + (c.col != null ? c.col : cols.length);
    if (!(key in colOf)) { colOf[key] = cols.length; cols.push({ label: c.stage || '', items: [] }); }
    cols[colOf[key]].items.push(c);
  });

  // measured height where we have one, estimate otherwise
  const hOf = (c) => {
    const el = cardEl[c.id];
    const h = el && el.offsetHeight;
    return h && h > 40 ? h : EST_H;
  };

  let tallest = 0;
  cols.forEach((col) => {
    col.h = col.items.reduce((a, c) => a + hOf(c), 0) + ROW_GAP * Math.max(0, col.items.length - 1);
    tallest = Math.max(tallest, col.h);
  });
  const axis = TOP + tallest / 2;

  LAY = {};
  cols.forEach((col, ci) => {
    const x = LEFT + ci * COL_PITCH;
    let y = axis - col.h / 2;
    // The stage name is NOT drawn on the canvas — it rides inside each card as
    // an eyebrow, so dragging a card never leaves its label behind.
    col.items.forEach((c) => {
      const h = hOf(c);
      LAY[c.id] = {
        x: c.x != null ? +c.x : x,
        y: c.y != null ? +c.y : Math.round(y),
        w: CW, h: h, col: ci,
      };
      y += h + ROW_GAP;
    });
  });

  const bottom = Math.max.apply(null, [TOP].concat(CARDS.map((c) => LAY[c.id].y + LAY[c.id].h)));
  // Every bypass edge gets its own row, so the long-jump block has to start
  // below the last return row. Count the returns this layout produces first.
  LANE_BACK = Math.round(bottom + 80);
  const edges = (SPEC && SPEC.edges) || [];
  let nBack = 0;
  edges.forEach((e) => {
    const a = LAY[e.from], b = LAY[e.to];
    if (a && b && laneOf(e, a, b, a.col, b.col) === 'back') nBack++;
  });
  LANE_LONG = LANE_BACK + nBack * LANE_GAP + 46;
  WORLD_W = LEFT + Math.max(1, cols.length) * COL_PITCH + 200;
  WORLD_H = LANE_LONG + edges.length * LANE_GAP + 160;
  const wl = $('world');
  wl.style.width = WORLD_W + 'px';
  wl.style.height = WORLD_H + 'px';
  $('edgeLayer').setAttribute('width', WORLD_W);  $('edgeLayer').setAttribute('height', WORLD_H);
  $('markLayer').setAttribute('width', WORLD_W);  $('markLayer').setAttribute('height', WORLD_H);
}

const posOf = (id) => S.pos[id] || LAY[id] || { x: 0, y: 0 };
const boxOf = (id) => { const p = posOf(id), l = LAY[id] || { w: CW, h: EST_H }; return { x: p.x, y: p.y, w: l.w, h: l.h }; };

/* ===================== edge routing ===================================== */
/* Orthogonal polyline with rounded corners — the design's roundPath verbatim. */
function roundPath(pts, r) {
  if (pts.length < 3) return 'M ' + pts[0][0] + ' ' + pts[0][1] + ' L ' + pts[1][0] + ' ' + pts[1][1];
  let d = 'M ' + pts[0][0] + ' ' + pts[0][1];
  for (let i = 1; i < pts.length - 1; i++) {
    const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
    const l1 = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]) || 1;
    const l2 = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) || 1;
    const rr = Math.min(r, l1 / 2, l2 / 2);
    const a = [p1[0] + (p0[0] - p1[0]) / l1 * rr, p1[1] + (p0[1] - p1[1]) / l1 * rr];
    const b = [p1[0] + (p2[0] - p1[0]) / l2 * rr, p1[1] + (p2[1] - p1[1]) / l2 * rr];
    d += ' L ' + a[0] + ' ' + a[1] + ' Q ' + p1[0] + ' ' + p1[1] + ' ' + b[0] + ' ' + b[1];
  }
  const e = pts[pts.length - 1];
  return d + ' L ' + e[0] + ' ' + e[1];
}

function arrowHead(e1, e2) {
  const ang = Math.atan2(e2[1] - e1[1], e2[0] - e1[0]);
  const L = 10, W = 4;
  return [
    e2[0] + ',' + e2[1],
    (e2[0] - L * Math.cos(ang) + W * Math.sin(ang)) + ',' + (e2[1] - L * Math.sin(ang) - W * Math.cos(ang)),
    (e2[0] - L * Math.cos(ang) - W * Math.sin(ang)) + ',' + (e2[1] - L * Math.sin(ang) + W * Math.cos(ang)),
  ].join(' ');
}

/* MULTI-PORT ROUTING — every edge gets its own port, channel and row.
   A card is not a single connector: outgoing edges stack down its RIGHT side and
   incoming edges stack down its LEFT side, PORT_GAP apart. Each stack is ordered
   by where the other end sits vertically, so the lines leaving one card do not
   cross each other on the way out. Edges sharing a gutter get their own vertical
   channel CHANNEL_GAP apart, and each bypass edge gets its own row LANE_GAP
   apart. Spacing is deliberately tight — distinct enough to trace one line with
   your eye, close enough that a bundle still reads as one flow. */

const laneOf = (e, a, b, ca, cb) => e.lane !== 'auto' ? e.lane
  : (b.x + b.w / 2 < a.x + a.w / 2) ? 'back' : (cb > ca + 1 ? 'long' : 'fwd');

/* n ports stacked on one side of `box`, centred on PORT_Y. The whole stack
   slides to stay on the card rather than clamping port-by-port, which would
   silently collapse two ports onto the same point. */
function stackPorts(box, n) {
  const span = (n - 1) * PORT_GAP;
  const lo = box.y + 20, hi = Math.max(lo, box.y + box.h - 20 - span);
  const top = Math.max(lo, Math.min(hi, box.y + PORT_Y - span / 2));
  const ys = [];
  for (let k = 0; k < n; k++) ys.push(top + k * PORT_GAP);
  return ys;
}

function routeEdges() {
  const E = SPEC.edges, N = E.length;
  const sy = new Array(N), ty = new Array(N), lane = new Array(N), chan = new Array(N);
  const midY = (id) => { const b = boxOf(id); return b.y + b.h / 2; };

  E.forEach((e, i) => {
    lane[i] = laneOf(e, boxOf(e.from), boxOf(e.to),
                     (LAY[e.from] || {}).col || 0, (LAY[e.to] || {}).col || 0);
  });

  // --- ports: fan each card's edges down its sides, ordered by the far end ---
  const outBy = {}, inBy = {};
  E.forEach((e, i) => {
    (outBy[e.from] = outBy[e.from] || []).push(i);
    (inBy[e.to] = inBy[e.to] || []).push(i);
  });
  Object.keys(outBy).forEach((id) => {
    const list = outBy[id].sort((p, q) => midY(E[p].to) - midY(E[q].to));
    stackPorts(boxOf(id), list.length).forEach((y, k) => { sy[list[k]] = y; });
  });
  Object.keys(inBy).forEach((id) => {
    const list = inBy[id].sort((p, q) => midY(E[p].from) - midY(E[q].from));
    stackPorts(boxOf(id), list.length).forEach((y, k) => { ty[list[k]] = y; });
  });

  // --- channels: one per edge, grouped by the gutter it crosses ---
  const gaps = {}, backs = [], longs = [];
  E.forEach((e, i) => {
    if (lane[i] === 'back') backs.push(i);
    else if (lane[i] === 'long') longs.push(i);
    else {
      const a = boxOf(e.from), b = boxOf(e.to);
      const k = Math.round((a.x + a.w + b.x) / 2);
      (gaps[k] = gaps[k] || []).push(i);
    }
  });
  Object.keys(gaps).forEach((k) => {
    const list = gaps[k].sort((p, q) => sy[p] - sy[q]);
    list.forEach((i, j) => {
      const a = boxOf(E[i].from), b = boxOf(E[i].to);
      const want = +k + (j - (list.length - 1) / 2) * CHANNEL_GAP;
      // never let a channel slide onto either card
      chan[i] = Math.max(a.x + a.w + 20, Math.min(b.x - 20, want));
    });
  });
  const rowOf = {};
  backs.sort((p, q) => midY(E[p].from) - midY(E[q].from)).forEach((i, j) => { rowOf[i] = j; });
  longs.sort((p, q) => midY(E[p].from) - midY(E[q].from)).forEach((i, j) => { rowOf[i] = j; });

  const parts = E.map((e, i) => {
    const a = boxOf(e.from), b = boxOf(e.to);
    let pts;
    // A card's LEFT side is its input and its RIGHT side is its output, so every
    // edge — forward, long or return — leaves from the right and arrives on the
    // left. A return edge therefore steps out to the right of its source, drops
    // to its row, runs back across under the board, and climbs the gutter to the
    // LEFT of its target. Exiting leftward would be shorter but would read as
    // something coming out of the source's input.
    // The bypass lanes run their verticals in the gutter between columns, never
    // down a column's centre line, which would spear the cards stacked below.
    if (lane[i] === 'back' || lane[i] === 'long') {
      const j = rowOf[i];
      const y = (lane[i] === 'back' ? LANE_BACK : LANE_LONG) + j * LANE_GAP;
      const off = Math.min(j * CHANNEL_GAP, 110);       // stay inside the gutter
      const x1 = a.x + a.w + 46 + off, x2 = b.x - 40 - off;
      pts = [[a.x + a.w, sy[i]], [x1, sy[i]], [x1, y], [x2, y], [x2, ty[i]], [b.x, ty[i]]];
    } else {
      const sx = a.x + a.w, tx = b.x, mx = chan[i];
      pts = Math.abs(sy[i] - ty[i]) < 2
        ? [[sx, sy[i]], [tx, ty[i]]]
        : [[sx, sy[i]], [mx, sy[i]], [mx, ty[i]], [tx, ty[i]]];
    }
    const back = lane[i] === 'back';
    const stroke = back ? 'var(--edge-back)' : 'var(--edge)';
    const d = roundPath(pts, 16);
    const head = arrowHead(pts[pts.length - 2], pts[pts.length - 1]);
    let g = '<g opacity="' + (back ? 0.5 : 0.9) + '">'
      + '<path d="' + d + '" fill="none" stroke="' + stroke + '" stroke-width="1.6" stroke-linecap="round"'
      + (back ? ' stroke-dasharray="3 6"' : '') + '></path>'
      + '<polygon points="' + head + '" fill="' + stroke + '"></polygon>';
    // No edge labels: canvas text that is not inside a box gets orphaned the
    // moment the user drags a card, and it reads as noise over the routing.
    // Anything worth saying about an edge belongs in one of the cards it joins.
    return g + '</g>';
  });
  $('edgeLayer').innerHTML = parts.join('');
}

/* ===================== card markup ====================================== */
function cardHTML(c) {
  const st = STATUS_COLOR[c.status] || '#4a5464';
  const H = [];
  H.push('<div class="card-hd">');
  H.push('<span class="badge">' + esc(c.n) + '</span>');
  if (c.kind)   H.push('<span class="chip">' + esc(c.kind) + '</span>');
  if (c.status) H.push('<span class="stat-lbl"><i class="dot" style="background:' + st + '"></i>' + esc(c.status) + '</span>');
  H.push('<button class="toggle" data-act="mode" title="Switch this card between the standard explanation and the plain-english one">Standard</button>');
  H.push('</div>');

  // The stage used to be a floating column heading on the canvas. It lives in
  // the card now, so it travels with the card when the user drags it.
  if (c.stage) H.push('<div class="eyebrow">' + esc(c.stage) + '</div>');

  H.push('<h2 class="card-title" data-act="title" title="Double-click to relabel">' + esc(c.title) + '</h2>');

  if (c.std || c.simple) {
    H.push('<div class="prose"><p class="std">' + esc(c.std) + '</p><p class="sim">' + esc(c.simple) + '</p></div>');
  }

  if (c.stats && c.stats.length) {
    H.push('<div class="well"><div class="stats">');
    c.stats.forEach((s) => H.push('<div><div class="stat-v">' + esc(s.v) + '</div><div class="stat-k">' + esc(s.k) + '</div></div>'));
    H.push('</div></div>');
  }

  if (c.ba) {
    H.push('<div class="well"><div class="ba">'
      + '<div class="ba-a"><div class="ba-k">' + esc(c.ba.aLabel) + '</div><div class="ba-v">' + esc(c.ba.a) + '</div></div>'
      + '<div class="ba-arrow">→</div>'
      + '<div class="ba-b"><div class="ba-k">' + esc(c.ba.bLabel) + '</div><div class="ba-v">' + esc(c.ba.b) + '</div></div>'
      + '</div></div>');
  }

  if (c.choice && c.choice.options) {
    H.push('<div class="well"><div class="well-q">' + esc(c.choice.q) + '</div><div class="opts">');
    c.choice.options.forEach((o, i) => H.push('<button class="opt" data-act="choice" data-i="' + i + '">' + esc(o.label) + '</button>'));
    H.push('</div><div class="reply" data-role="choice-reply"></div></div>');
  }

  if (c.quiz && c.quiz.options) {
    H.push('<div class="well"><div class="well-lbl">Knowledge check</div><div class="well-q">' + esc(c.quiz.q) + '</div><div class="chips">');
    c.quiz.options.forEach((o, i) => H.push('<button class="qopt" data-act="quiz" data-i="' + i + '">' + esc(o) + '</button>'));
    H.push('</div><div class="reply" data-role="quiz-reply"></div></div>');
  }

  if (c.code) H.push('<div class="code">' + esc(c.code) + '</div>');

  if (c.pitfall) {
    H.push('<div class="pit"><div class="pit-lbl">Pitfall</div><div class="pit-body">'
      + '<div class="std">' + esc(c.pitfall.std) + '</div>'
      + '<div class="sim">' + esc(c.pitfall.simple == null ? c.pitfall.std : c.pitfall.simple) + '</div>'
      + '</div></div>');
  }

  if (c.file) H.push('<div class="card-ft"><span>Lives in</span><span class="mono">' + esc(c.file) + '</span></div>');
  return H.join('');
}

function buildCards() {
  const host = $('cards');
  host.innerHTML = '';
  cardEl = {};
  CARDS.forEach((c) => {
    const el = document.createElement('article');
    el.className = 'card' + (c.key ? ' key' : '');
    el.style.width = CW + 'px';
    el.dataset.id = c.id;
    el.innerHTML = cardHTML(c);
    host.appendChild(el);
    cardEl[c.id] = el;
  });
}

/* ===================== painting ========================================= */
function applyView() {
  const w = $('world'), s = $('surface');
  w.style.transform = 'translate(' + S.tx + 'px,' + S.ty + 'px) scale(' + S.z + ')';
  s.style.backgroundSize = (24 * S.z) + 'px ' + (24 * S.z) + 'px';
  s.style.backgroundPosition = S.tx + 'px ' + S.ty + 'px';
  $('zoomPct').textContent = Math.round(S.z * 100) + '%';
}

function applyPositions() {
  CARDS.forEach((c) => {
    const p = posOf(c.id), el = cardEl[c.id];
    if (el) el.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px)';
  });
  // User boxes are positioned absolutely and are never re-laid-out, so they are
  // NOT re-rendered here — rebuilding their DOM would drop textarea focus.
  routeEdges();
}

function applyCard(c) {
  const el = cardEl[c.id]; if (!el) return;
  const sim = isSimple(c.id);
  el.classList.toggle('simple', sim);
  el.classList.toggle('struck', !!S.struck[c.id]);
  const tg = el.querySelector('[data-act="mode"]');
  if (tg) { tg.classList.toggle('on', sim); tg.textContent = sim ? 'Plain english' : 'Standard'; }

  if (c.choice && c.choice.options) {
    const pick = S.choices[c.id];
    el.querySelectorAll('[data-act="choice"]').forEach((b, i) => b.classList.toggle('on', pick === i));
    const r = el.querySelector('[data-role="choice-reply"]');
    if (r) {
      const has = pick !== undefined && c.choice.options[pick];
      r.classList.toggle('show', !!has);
      r.textContent = has ? (c.choice.options[pick].r || '') : '';
    }
  }
  if (c.quiz && c.quiz.options) {
    const pick = S.quiz[c.id], ok = pick === c.quiz.correct;
    el.querySelectorAll('[data-act="quiz"]').forEach((b, i) => {
      b.classList.toggle('on', pick === i);
      b.classList.toggle('right', pick === i && i === c.quiz.correct);
    });
    const r = el.querySelector('[data-role="quiz-reply"]');
    if (r) {
      r.classList.toggle('show', pick !== undefined);
      r.classList.toggle('right', pick !== undefined && ok);
      r.textContent = pick === undefined ? '' : (ok ? (c.quiz.right || 'Correct.') : (c.quiz.wrong || 'Not quite.'));
    }
  }
  const t = el.querySelector('[data-act="title"]');
  if (t && S.titles[c.id] != null && t.textContent !== S.titles[c.id]) t.textContent = S.titles[c.id];
}
const applyCards = () => CARDS.forEach(applyCard);

function applyChrome() {
  $('segStd').classList.toggle('on', !S.modeAll);
  $('segSim').classList.toggle('on', S.modeAll);
  $('surface').className = 't-' + S.tool;
  $('tools').querySelectorAll('.tool').forEach((b) => b.classList.toggle('on', b.dataset.key === S.tool));
  $('colors').querySelectorAll('.swatch').forEach((b) => b.classList.toggle('on', b.dataset.hex === S.color));
}

function renderMarks() {
  $('markLayer').innerHTML = S.marks.map((m) =>
    '<polyline points="' + m.pts.map((p) => p[0] + ',' + p[1]).join(' ') + '" fill="none"'
    + ' stroke="' + m.color + '" stroke-width="' + (m.type === 'marker' ? 16 : 2.6) + '"'
    + ' stroke-linecap="round" stroke-linejoin="round" opacity="' + (m.type === 'marker' ? 0.28 : 1) + '"></polyline>'
  ).join('');
}

function addNoteEl(n) {
  const el = document.createElement('div');
  el.className = 'note'; el.dataset.id = n.id;
  el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
  const ta = document.createElement('textarea');
  ta.placeholder = 'note for the agent…';
  ta.value = n.text || '';
  ta.addEventListener('input', () => { n.text = ta.value; save.schedule(); });
  el.appendChild(ta);
  $('noteLayer').appendChild(el);
  return { el: el, ta: ta };
}
function renderNotes() {
  $('noteLayer').innerHTML = '';
  S.notes.forEach(addNoteEl);
}

/* ---- user-drawn boxes ---------------------------------------------------
   A box the USER adds with the box tool: a card of their own, in their words.
   It carries no stage and joins no edge — it is a proposal for the agent to
   fold into the board, and read_feedback.py reports it as ADDED. */
function addBoxEl(b) {
  const el = document.createElement('div');
  el.className = 'ubox'; el.dataset.id = b.id;
  el.style.left = b.x + 'px'; el.style.top = b.y + 'px';
  const hd = document.createElement('div');
  hd.className = 'ubox-hd'; hd.textContent = 'Your box';
  const ta = document.createElement('textarea');
  ta.placeholder = 'what belongs here?';
  ta.value = b.text || '';
  ta.addEventListener('input', () => { b.text = ta.value; save.schedule(); });
  el.appendChild(hd); el.appendChild(ta);
  $('boxLayer').appendChild(el);
  return { el: el, ta: ta };
}
function renderBoxes() {
  $('boxLayer').innerHTML = '';
  S.boxes.forEach(addBoxEl);
}

/* ===================== save / load ====================================== */
function snapshot() {
  return {
    v: 2, slug: slug, savedAt: new Date().toISOString(),
    view: { z: S.z, tx: S.tx, ty: S.ty },
    mode: { all: S.modeAll, per: S.modePer },
    layout: LAY,
    pos: S.pos, titles: S.titles,
    struck: Object.keys(S.struck).filter((k) => S.struck[k]),
    choices: S.choices, quiz: S.quiz,
    notes: S.notes.map((n) => ({ id: n.id, x: Math.round(n.x), y: Math.round(n.y), text: n.text || '' })),
    boxes: S.boxes.map((b) => ({ id: b.id, x: Math.round(b.x), y: Math.round(b.y), text: b.text || '' })),
    marks: S.marks.map((m) => ({ id: m.id, type: m.type, color: m.color,
      pts: m.pts.map((p) => [Math.round(p[0]), Math.round(p[1])]) })),
  };
}

const save = (function () {
  let t = null, inflight = false, again = false;
  async function now() {
    if (inflight) { again = true; return; }
    inflight = true;
    setStatus('busy', 'saving…');
    try {
      const r = await fetch('/save/' + slug, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(snapshot()),
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      setStatus('saved', 'feedback saved ✓');
    } catch (e) {
      setStatus('fail', 'save failed — ' + (e.message || e));
    }
    inflight = false;
    if (again) { again = false; now(); }
  }
  return { now: now, schedule: () => { clearTimeout(t); t = setTimeout(now, 800); } };
})();

function restore(snap) {
  if (!snap || typeof snap !== 'object') return;
  if (snap.view) { S.z = +snap.view.z || S.z; S.tx = +snap.view.tx || 0; S.ty = +snap.view.ty || 0; }
  if (snap.mode) { S.modeAll = !!snap.mode.all; S.modePer = snap.mode.per || {}; }
  S.pos = snap.pos || {};
  S.titles = snap.titles || {};
  (snap.struck || []).forEach((k) => { S.struck[k] = true; });
  S.choices = snap.choices || {};
  S.quiz = snap.quiz || {};
  S.notes = (snap.notes || []).map((n) => ({ id: n.id || uid('n'), x: +n.x || 0, y: +n.y || 0, text: n.text || '' }));
  S.boxes = (snap.boxes || []).map((b) => ({ id: b.id || uid('b'), x: +b.x || 0, y: +b.y || 0, text: b.text || '' }));
  S.marks = (snap.marks || []).map((m) => ({ id: m.id || uid('m'), type: m.type === 'marker' ? 'marker' : 'pen',
    color: m.color || '#ff7a1a', pts: (m.pts || []).map((p) => [+p[0], +p[1]]) }));
}

/* ===================== interaction ====================================== */
function toFlow(ev) {
  const r = $('surface').getBoundingClientRect();
  return { x: (ev.clientX - r.left - S.tx) / S.z, y: (ev.clientY - r.top - S.ty) / S.z };
}

function nearest(x, y) {
  let best = null, bd = Infinity;
  CARDS.forEach((c) => {
    const b = boxOf(c.id);
    const dx = Math.max(b.x - x, 0, x - (b.x + b.w));
    const dy = Math.max(b.y - y, 0, y - (b.y + b.h));
    const d = Math.hypot(dx, dy);
    if (d < bd) { bd = d; best = c; }
  });
  return best ? '“' + (S.titles[best.id] || best.title) + '”' : 'the canvas';
}

function fit() {
  const s = $('surface').getBoundingClientRect();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  CARDS.forEach((c) => { const b = boxOf(c.id);
    x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y - 40); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); });
  if (!isFinite(x0)) return;
  const pad = 48;
  const z = Math.min(1.6, Math.max(0.1, Math.min((s.width - pad * 2) / (x1 - x0), (s.height - pad * 2) / (y1 - y0))));
  S.z = z;
  S.tx = (s.width - (x1 - x0) * z) / 2 - x0 * z;
  S.ty = (s.height - (y1 - y0) * z) / 2 - y0 * z;
  applyView(); save.schedule();
}

function wire() {
  const surf = $('surface');

  /* --- toolbar / header ------------------------------------------------- */
  $('tools').innerHTML = TOOLS.map((t) =>
    '<button class="tool" data-key="' + t.key + '" title="' + esc(t.title) + '" aria-label="' + esc(t.name) + '">' + t.glyph + '</button>').join('');
  $('colors').innerHTML = COLORS.map(([hex, label]) =>
    '<button class="swatch" data-hex="' + hex + '" style="background:' + hex + '" title="' + label + '" aria-label="' + label + '"></button>').join('');
  // blur() after picking: a focused toolbar button would swallow the next Space as a
  // re-click, which silently flips the tool back mid-sentence while typing a note.
  $('tools').addEventListener('click', (e) => { const b = e.target.closest('.tool'); if (b) { S.tool = b.dataset.key; b.blur(); applyChrome(); } });
  $('colors').addEventListener('click', (e) => { const b = e.target.closest('.swatch'); if (b) { S.color = b.dataset.hex; b.blur(); applyChrome(); } });
  $('clearBtn').addEventListener('click', () => {
    S.marks = []; S.notes = []; S.boxes = [];
    renderMarks(); renderNotes(); renderBoxes(); save.now();
  });

  $('segStd').addEventListener('click', () => { S.modeAll = false; S.modePer = {}; applyChrome(); applyCards(); relayoutSoon(); save.schedule(); });
  $('segSim').addEventListener('click', () => { S.modeAll = true;  S.modePer = {}; applyChrome(); applyCards(); relayoutSoon(); save.schedule(); });
  // Buttons zoom about the middle of the viewport, so the thing you were looking
  // at stays put. (zoomAt + its consts are declared further down in wire().)
  const zoomCentre = (f) => { const r = surf.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, f); };
  $('zIn').addEventListener('click',  () => zoomCentre(1.12));
  $('zOut').addEventListener('click', () => zoomCentre(1 / 1.12));
  $('zFit').addEventListener('click', fit);
  $('copyBtn').addEventListener('click', copyNotes);

  /* --- card interactions (delegated) ----------------------------------- */
  $('cards').addEventListener('click', (e) => {
    const card = e.target.closest('.card'); if (!card) return;
    const c = byId[card.dataset.id]; if (!c) return;
    const act = e.target.closest('[data-act]');
    if (!act) return;
    const kind = act.dataset.act;
    if (kind === 'mode')   { S.modePer[c.id] = !isSimple(c.id); applyCard(c); relayoutSoon(); save.schedule(); }
    if (kind === 'choice') { S.choices[c.id] = +act.dataset.i; applyCard(c); relayoutSoon(); save.schedule(); }
    if (kind === 'quiz')   { S.quiz[c.id]    = +act.dataset.i; applyCard(c); relayoutSoon(); save.schedule(); }
  });

  // double-click a title to relabel it
  $('cards').addEventListener('dblclick', (e) => {
    const t = e.target.closest('[data-act="title"]'); if (!t) return;
    t.contentEditable = 'true'; t.focus();
    const sel = window.getSelection(), rng = document.createRange();
    rng.selectNodeContents(t); sel.removeAllRanges(); sel.addRange(rng);
  });
  $('cards').addEventListener('blur', (e) => {
    const t = e.target.closest && e.target.closest('[data-act="title"]');
    if (!t || t.contentEditable !== 'true') return;
    t.contentEditable = 'false';
    const card = t.closest('.card'), c = byId[card.dataset.id];
    const now = t.textContent.trim() || c.title;
    t.textContent = now;
    if (now === c.title) delete S.titles[c.id]; else S.titles[c.id] = now;
    relayoutSoon(); save.schedule();
  }, true);
  $('cards').addEventListener('keydown', (e) => {
    const t = e.target.closest && e.target.closest('[data-act="title"]');
    if (!t || t.contentEditable !== 'true') return;
    if (e.key === 'Enter') { e.preventDefault(); t.blur(); }
    if (e.key === 'Escape') { const c = byId[t.closest('.card').dataset.id]; t.textContent = S.titles[c.id] || c.title; t.blur(); }
  });

  /* --- pointer: pan, card drag, draw, note, erase ---------------------- */
  surf.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    // The toolbar and legend live INSIDE #surface, so every tool must let their
    // clicks through. Without this the pen swallowed its own escape hatch: the
    // preventDefault() below cancels the click that would switch tools, and the
    // user is stuck drawing with no way back to Move.
    if (e.target.closest('#toolbar, #legend')) return;

    const card = e.target.closest('.card');
    const ubox = e.target.closest('.ubox');
    const p = toFlow(e);

    if (S.tool === 'move') {
      if (e.target.closest('button, textarea, [contenteditable="true"]')) return;
      if (ubox) {
        const id = ubox.dataset.id, b = S.boxes.find((q) => q.id === id);
        if (!b) return;
        drag = { mode: 'box', id: id, x: e.clientX, y: e.clientY, ox: b.x, oy: b.y };
        ubox.classList.add('dragging');
        surf.setPointerCapture(e.pointerId);
        return;
      }
      if (card) {
        const id = card.dataset.id, b = posOf(id);
        drag = { mode: 'card', id: id, x: e.clientX, y: e.clientY, ox: b.x, oy: b.y };
        card.classList.add('dragging');
      } else {
        drag = { mode: 'pan', x: e.clientX, y: e.clientY, tx: S.tx, ty: S.ty };
        surf.classList.add('panning');
      }
      surf.setPointerCapture(e.pointerId);
      return;
    }
    if (S.tool === 'pen' || S.tool === 'marker') {
      e.preventDefault();
      drag = { mode: 'draw' };
      S.marks.push({ id: uid('m'), type: S.tool, color: S.color, pts: [[p.x, p.y]] });
      renderMarks();
      surf.setPointerCapture(e.pointerId);
      return;
    }
    if (S.tool === 'note' || S.tool === 'box') return;   // handled on pointerup — see below
    if (S.tool === 'eraser') {
      const noteEl = e.target.closest('.note');
      if (noteEl) {
        S.notes = S.notes.filter((n) => n.id !== noteEl.dataset.id);
        noteEl.remove(); save.schedule(); return;
      }
      if (ubox) {
        S.boxes = S.boxes.filter((b) => b.id !== ubox.dataset.id);
        ubox.remove(); save.schedule(); return;
      }
      const before = S.marks.length;
      S.marks = S.marks.filter((m) => !m.pts.some((q) => Math.hypot(q[0] - p.x, q[1] - p.y) < 22));
      if (S.marks.length !== before) { renderMarks(); save.schedule(); return; }
      if (card) {
        const id = card.dataset.id;
        S.struck[id] = !S.struck[id];
        applyCard(byId[id]); save.schedule();
      }
    }
  });

  // Note tool: drop the sticky on pointerUP, not down. mousedown (which fires between
  // the two) clears focus, so focusing the textarea any earlier gets undone and the
  // user's first keystrokes fall through to the tool shortcuts.
  surf.addEventListener('pointerup', (e) => {
    if (S.tool !== 'note' && S.tool !== 'box') return;
    if (e.target.closest('#toolbar, #legend, .note, .ubox, .card')) return;
    const p = toFlow(e);
    let made;
    if (S.tool === 'box') {
      const b = { id: uid('b'), x: Math.round(p.x - 125), y: Math.round(p.y - 60), text: '' };
      S.boxes.push(b);
      made = addBoxEl(b);
    } else {
      const n = { id: uid('n'), x: Math.round(p.x - 95), y: Math.round(p.y - 30), text: '' };
      S.notes.push(n);
      made = addNoteEl(n);
    }
    S.tool = 'move'; applyChrome();
    made.ta.focus();
    save.schedule();
  });

  surf.addEventListener('pointermove', (e) => {
    if (!drag) return;
    if (drag.mode === 'pan') {
      S.tx = drag.tx + (e.clientX - drag.x); S.ty = drag.ty + (e.clientY - drag.y);
      applyView();
    } else if (drag.mode === 'card') {
      S.pos[drag.id] = {
        x: Math.round(drag.ox + (e.clientX - drag.x) / S.z),
        y: Math.round(drag.oy + (e.clientY - drag.y) / S.z),
      };
      const el = cardEl[drag.id];
      el.style.transform = 'translate(' + S.pos[drag.id].x + 'px,' + S.pos[drag.id].y + 'px)';
      routeEdges();               // live re-route — lines follow the card
    } else if (drag.mode === 'box') {
      const b = S.boxes.find((q) => q.id === drag.id);
      if (!b) return;
      b.x = Math.round(drag.ox + (e.clientX - drag.x) / S.z);
      b.y = Math.round(drag.oy + (e.clientY - drag.y) / S.z);
      const el = $('boxLayer').querySelector('[data-id="' + drag.id + '"]');
      if (el) { el.style.left = b.x + 'px'; el.style.top = b.y + 'px'; }
    } else {
      const p = toFlow(e);
      const m = S.marks[S.marks.length - 1];
      if (m) { m.pts.push([p.x, p.y]); renderMarks(); }
    }
  });

  const endDrag = () => {
    if (!drag) return;
    if (drag.mode === 'card') cardEl[drag.id] && cardEl[drag.id].classList.remove('dragging');
    if (drag.mode === 'box') {
      const el = $('boxLayer').querySelector('[data-id="' + drag.id + '"]');
      if (el) el.classList.remove('dragging');
    }
    surf.classList.remove('panning');
    drag = null;
    save.schedule();
  };
  surf.addEventListener('pointerup', endDrag);
  surf.addEventListener('pointercancel', endDrag);

  /* Continuous zoom. The old version applied a flat ±9% per wheel event no
     matter how far the wheel actually moved, which on a trackpad — where one
     gesture fires dozens of tiny events — read as a fast staircase. Scale
     exponentially with the REAL delta instead, so a slow gesture zooms slowly
     and gestures compose smoothly: exp() means two half-deltas equal one whole. */
  const ZOOM_MIN = 0.1, ZOOM_MAX = 2.4, ZOOM_RATE = 0.0016;
  function zoomAt(mx, my, factor) {
    const nz = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, S.z * factor));
    const k = nz / S.z;
    S.tx = mx - (mx - S.tx) * k; S.ty = my - (my - S.ty) * k; S.z = nz;
    applyView(); save.schedule();
  }
  surf.addEventListener('wheel', (e) => {
    if (e.target.closest('#toolbar, #legend')) return;
    e.preventDefault();
    let dy = e.deltaY;
    if (e.deltaMode === 1) dy *= 16;        // DOM_DELTA_LINE  → px
    else if (e.deltaMode === 2) dy *= 380;  // DOM_DELTA_PAGE  → px
    // A notched mouse wheel emits one huge delta per click; clamp so it steps
    // about as far as a comfortable trackpad flick rather than jumping the view.
    dy = Math.max(-90, Math.min(90, dy));
    // macOS pinch arrives as ctrl+wheel with smaller deltas — give it more travel.
    zoomAt(e.clientX - surf.getBoundingClientRect().left,
           e.clientY - surf.getBoundingClientRect().top,
           Math.exp(-dy * ZOOM_RATE * (e.ctrlKey ? 2.2 : 1)));
  }, { passive: false });

  /* --- keyboard shortcuts ---------------------------------------------- */
  window.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'textarea' || tag === 'input' || e.target.isContentEditable) return;
    const map = { v: 'move', p: 'pen', h: 'marker', n: 'note', b: 'box', e: 'eraser' };
    const k = e.key.toLowerCase();
    if (map[k]) { S.tool = map[k]; applyChrome(); }
    else if (k === 'f') fit();
    else if (k === 's') { S.modeAll = !S.modeAll; S.modePer = {}; applyChrome(); applyCards(); relayoutSoon(); save.schedule(); }
  });
}

function copyNotes() {
  const L = ['Whiteboard notes — ' + (SPEC.title || slug), ''];
  CARDS.forEach((c) => {
    if (c.choice && S.choices[c.id] !== undefined) {
      L.push('· ' + c.title + ' → answered “' + c.choice.options[S.choices[c.id]].label + '”');
    }
    if (c.quiz && S.quiz[c.id] !== undefined) {
      const ok = S.quiz[c.id] === c.quiz.correct;
      L.push('· ' + c.title + ' → quiz: “' + c.quiz.options[S.quiz[c.id]] + '” (' + (ok ? 'correct' : 'wrong') + ')');
    }
    if (S.titles[c.id]) L.push('· relabelled “' + c.title + '” → “' + S.titles[c.id] + '”');
    if (S.struck[c.id]) L.push('· struck out “' + c.title + '”');
    const base = LAY[c.id], p = S.pos[c.id];
    if (base && p && (Math.abs(p.x - base.x) > 8 || Math.abs(p.y - base.y) > 8)) {
      L.push('· moved “' + c.title + '” by (' + Math.round(p.x - base.x) + ', ' + Math.round(p.y - base.y) + ')');
    }
  });
  S.boxes.forEach((b) =>
    L.push('· ADDED a box near ' + nearest(b.x, b.y) + ': ' + ((b.text || '').trim() || '(empty)')));
  S.notes.filter((n) => (n.text || '').trim()).forEach((n) =>
    L.push('· note near ' + nearest(n.x, n.y) + ': ' + n.text.trim()));
  S.marks.forEach((m) =>
    L.push('· ' + (m.type === 'marker' ? 'highlighter' : 'pen') + ' mark over ' + nearest(m.pts[0][0], m.pts[0][1])));
  if (L.length === 2) L.push('(nothing marked up yet)');

  const txt = L.join('\n');
  const done = () => {
    const b = $('copyBtn');
    b.classList.add('done'); b.textContent = 'Notes copied ✓';
    setTimeout(() => { b.classList.remove('done'); b.textContent = 'Copy notes for the agent'; }, 1800);
  };
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, done);
  else done();
}

/* ===================== relayout on content change ======================= */
/* Cards change height when a plain-english body is longer, or a quiz answer
   reveals feedback. Re-run layout so the column keeps its spacing — but never
   stomp a card the user has dragged. */
let relayoutTimer = null;
function relayoutSoon() {
  clearTimeout(relayoutTimer);
  relayoutTimer = setTimeout(() => { layout(); applyPositions(); }, 340);
}

/* ===================== boot ============================================= */
async function main() {
  slug = location.pathname.split('/').filter(Boolean)[0] || 'board';
  const reseed = new URLSearchParams(location.search).get('reseed') === '1';

  let raw = null, snap = null;
  try {
    const r = await fetch('./board.json?t=' + Date.now());
    if (r.ok) raw = await r.json(); else note('board.json: HTTP ' + r.status);
  } catch (e) { note('board.json: ' + e.message); }
  if (!raw) { $('boot').textContent = 'No board.json found for "' + slug + '".'; return; }

  if (!reseed) {
    try { const r = await fetch('./snapshot.json?t=' + Date.now()); if (r.ok) snap = await r.json(); } catch (_) {}
  }

  SPEC = normalize(raw);
  CARDS = SPEC.cards;
  byId = {}; CARDS.forEach((c) => { byId[c.id] = c; });
  if (!CARDS.length) { $('boot').textContent = 'board.json has no cards.'; return; }

  document.documentElement.style.setProperty('--accent', SPEC.accent || '#5aa2ff');
  document.title = (SPEC.title || slug) + ' — Whiteboard';
  $('hdTitle').textContent = SPEC.title || slug;
  if (SPEC.subtitle) $('hdSub').textContent = SPEC.subtitle;
  S.modeAll = SPEC.defaultMode === 'simple';

  buildCards();
  applyChrome();
  applyCards();
  layout();                       // measured heights are live now that cards are in the DOM

  // seed notes from the spec on a fresh board
  if (!snap && SPEC.seedNotes.length) {
    let nx = LEFT, ny = LANE_LONG + 20;
    SPEC.seedNotes.forEach((t) => {
      S.notes.push({ id: uid('n'), x: nx, y: ny, text: t });
      nx += 210; if (nx > LEFT + 840) { nx = LEFT; ny += 140; }
    });
  }

  if (snap) restore(snap);
  applyChrome();                  // after restore, so the header reflects the saved mode
  applyCards();
  applyPositions();
  renderNotes();
  renderBoxes();
  renderMarks();

  if (snap && snap.view) applyView(); else fit();

  $('boot').remove();
  if (!snap) save.now(); else setStatus('saved', 'board ready ✓');

  // re-measure once fonts settle, and whenever a card's height actually changes
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); applyPositions(); });
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => relayoutSoon());
    CARDS.forEach((c) => cardEl[c.id] && ro.observe(cardEl[c.id]));
  }

  // expose for scripted checks
  window.__wb = { S: S, SPEC: SPEC, LAY: LAY, snapshot: snapshot, layout: layout, applyPositions: applyPositions, boxOf: boxOf };
}

wire();
main().catch((e) => {
  const b = $('boot'); if (b) b.remove();
  note('Fatal: ' + (e && e.stack || e));
});

})();
</script>
</body>
</html>
